name: repository-check

on:
  push:
  pull_request:

jobs:
  safety-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check repository safety
        run: python scripts/repository_check.py
      - name: Run tests
        run: ./mvnw --batch-mode test
