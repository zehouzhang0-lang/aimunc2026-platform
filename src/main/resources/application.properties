server.port=${PORT:8081}
spring.application.name=AIMUNC2026

# Required runtime configuration. Never commit real credentials.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

aimunc.upload.path=${AIMUNC_UPLOAD_PATH:./data/uploads/payments}

# Use a cryptographically random value of at least 32 bytes.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:2592000000}
