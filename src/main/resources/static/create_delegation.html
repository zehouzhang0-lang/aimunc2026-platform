<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建代表团 - AIMUNC 2026</title>
    <!-- ▼▼▼ 主题初始化：必须在所有 CSS 之前同步执行，消除主题闪烁 ▼▼▼
         原理：<html data-theme="dark"> 是 HTML 硬编码的初始值，
</body> 前加载，CSS 已带着 dark 渲染完毕，
               用户会看到 dark→light 的闪烁，或在 JS 报错时永久停在 dark。
               本脚本放在 <head> 最前、任何 <link> 之前同步运行，
               保证 CSS 只渲染一次、渲染正确的主题。 -->
    <script>
        (function(){try{
            var t=localStorage.getItem('aimunc_theme');
            if(t!=='light'&&t!=='dark'){t=localStorage.getItem('mun_theme');}
            if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}
        }catch(e){}}());
    </script>
    <!-- ▲▲▲ 主题初始化结束 ▲▲▲ -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="aimunc-theme.css">
    <!-- 【#040 Task 6 · Step A】Three.js CDN — Chen-Lee 背景板依赖 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* 内容层居中 */
        .aimunc-content {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        /* 卡片约束 */
        .setup-card {
            width: 100%;
            max-width: 560px;
            padding: 40px 36px;
        }

        .setup-card h2 {
            color: var(--text-heading);
            font-weight: 700;
            margin-bottom: 1.8rem;
        }

        /* 分割线 */
        .aimunc-divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 24px 0;
        }

        /* 小节标签 */
        .section-label {
            font-weight: 700;
            font-size: 0.88rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        /* 提示文字 */
        .hint-text {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* 软提醒：协会名重名 */
        .warn-alert {
            background: rgba(255,209,102,0.1);
            border: 1px solid var(--warning);
            border-radius: 8px;
            color: var(--warning);
            padding: 10px 14px;
            font-size: 0.83rem;
            margin-top: 8px;
            display: none;
        }

        /* 硬拦截：学校已建团 */
        .error-alert {
            background: rgba(239,71,111,0.08);
            border: 1px solid var(--danger);
            border-radius: 8px;
            color: var(--danger);
            padding: 10px 14px;
            font-size: 0.83rem;
            margin-top: 8px;
            display: none;
        }

        /* 手机号提示 */
        #phoneHint { min-height: 18px; font-size: 0.82rem; margin-top: 4px; }

        /* 主按钮 */
        .btn-create {
            background: var(--accent);
            color: #fff; border: none;
            border-radius: 8px; padding: 14px;
            font-weight: 700; width: 100%;
            font-size: 1rem;
            transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-create:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 20px var(--accent-glow);
            transform: translateY(-1px);
        }
        .btn-create:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* 返回链接 */
        .back-link {
            display: block; text-align: center;
            color: var(--text-secondary) !important;
            font-size: 0.85rem; text-decoration: none;
            margin-top: 12px;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent) !important; }

        /* 加载提示 */
        #loadingMsg { color: var(--text-secondary); font-size: 0.88rem; }

        /* 移动端 */
        @media (max-width: 767px) {
            .aimunc-content { padding: 0; align-items: stretch; }
            .setup-card {
                max-width: 100%;
                padding: 28px 20px;
                border-radius: 0 !important;
                min-height: 100vh;
            }
        }

        /* ── 主题切换按鈕：强制固定左下角，与 index/guide 页统一 ── */
        #aimunc-theme-toggle {
            position: fixed !important;
            bottom: 24px !important;
            left: 24px !important;
            right: auto !important;
            top: auto !important;
            z-index: 9999 !important;
        }
    </style>
</head>
<body>

<!-- 【#040 Task 6 · Step B】背景层：CSS 网格兜底 + Chen-Lee canvas 容器 -->
<div class="aimunc-bg"></div>
<div class="aimunc-bg-chenlee" id="chenlee-bg" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;"></div>

<!-- 内容层 -->
<div class="aimunc-content">
    <div class="aimunc-card aimunc-form setup-card">
        <h2 class="text-center">🏗️ 建立代表团</h2>

        <form id="delegationForm">
            <input type="number" name="leaderUserId" id="autoLeaderId" style="display:none;" readonly>

            <!-- 代表团名称 -->
            <div class="mb-3">
                <label class="form-label fw-bold">代表团名称</label>
                <input type="text" name="name" id="nameInput"
                       class="form-control form-control-lg"
                       placeholder="例如：厦门一中模拟联合国协会" required>
                <div id="nameWarnAlert" class="warn-alert">
                    ⚠️ <strong>该协会名称已存在。</strong>若您属于不同校区，请在下方准确填写您所属的校区名称，系统将据此区分。
                </div>
            </div>

            <!-- 所属学校 -->
            <div class="mb-3">
                <label class="form-label fw-bold">所属学校 / 校区 <span class="text-danger">*</span></label>
                <input type="text" name="schoolName" id="schoolInput"
                       class="form-control form-control-lg"
                       placeholder="例如：福建省厦门第一中学思明校区" required>
                <div class="hint-text">每所学校/校区只能建立一个代表团，请填写完整准确的校区名称。</div>
                <div class="hint-text" style="margin-top:3px;">* 领队必须属于该校区，系统将记录您的身份信息以备学委核实。</div>
                <div id="schoolErrorAlert" class="error-alert">
                    🚫 <strong>该学校已建好代表团，不能重复建团。</strong>请确认校区名称，或联系系统管理员。
                </div>
            </div>

            <!-- 领队实名信息 -->
            <hr class="aimunc-divider">
            <p class="section-label">👤 领队实名信息</p>

            <div class="mb-3">
                <label class="form-label fw-bold">领队姓名 <span class="text-danger">*</span></label>
                <input type="text" name="leaderName" id="leaderNameInput"
                       class="form-control form-control-lg"
                       placeholder="例如：张三" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">领队手机号 <span class="text-danger">*</span></label>
                <input type="tel" name="leaderPhone" id="leaderPhoneInput"
                       class="form-control form-control-lg"
                       placeholder="11位手机号，例如：13800138000"
                       maxlength="11" required oninput="validatePhone(this)">
                <div id="phoneHint"></div>
            </div>

            <button type="submit" id="submitBtn" class="btn-create">立即生成邀请码并进入后台</button>
            <a href="index.html" class="back-link">← 返回首页</a>
        </form>

        <div id="loadingMsg" class="mt-3 text-center" style="display:none;">正在为您生成专属邀请码...</div>
    </div>
</div>

<script src="aimunc-theme.js"></script>
<script>
    /* ── 主题图标补写：MutationObserver 确保按鈕注入后立刻写入图标 ── */
    (function() {
        function applyIcon() {
            var btn = document.getElementById('aimunc-theme-toggle');
            if (!btn) return false;
            if (!btn.textContent.trim()) {
                var theme = document.documentElement.getAttribute('data-theme') || 'dark';
                btn.textContent = theme === 'dark' ? '🌙' : '☀️';
            }
            return true;
        }
        if (applyIcon()) return;
        var obs = new MutationObserver(function() {
            if (applyIcon()) obs.disconnect();
        });
        obs.observe(document.documentElement, { childList: true, subtree: true });
        setTimeout(function() { applyIcon(); obs.disconnect(); }, 300);
    })();
</script>

<!-- 【#040 Task 6 · Step C】Chen-Lee 背景板初始化 -->
<script src="chen-lee-bg.js"></script>
<script>
    (function() {
        var bg = window.aimuncBgInit('chenlee-bg');
        if (bg) window._aimuncBg = bg;
    })();
</script>

<script>
    // ════════════════════════════════════════════════════════════════
    // 以下所有业务逻辑与原版完全一致，未做任何改动
    // ════════════════════════════════════════════════════════════════

    function validatePhone(el) {
        const hint = document.getElementById('phoneHint');
        const val  = el.value.replace(/\D/g, '');
        el.value = val;
        if (!val) { hint.style.color = ''; hint.textContent = ''; return false; }
        if (val.length < 11) {
            hint.style.color = 'var(--danger)';
            hint.textContent = '❌ 还差 ' + (11 - val.length) + ' 位';
            return false;
        }
        if (!/^1[3-9]\d{9}$/.test(val)) {
            hint.style.color = 'var(--danger)';
            hint.textContent = '❌ 手机号格式不正确，请检查';
            return false;
        }
        hint.style.color = 'var(--success)';
        hint.textContent = '✅ 格式正确';
        return true;
    }

    window.onload = function() {
        const savedId = sessionStorage.getItem('mun_user_id');
        if (savedId) {
            document.getElementById('autoLeaderId').value = savedId;
        } else {
            alert("请先注册领队账号！");
            window.location.href = 'register.html';
        }
        document.getElementById('nameInput').addEventListener('blur', checkNameExists);
    };

    async function checkNameExists() {
        const name = document.getElementById('nameInput').value.trim();
        const warnAlert = document.getElementById('nameWarnAlert');
        if (!name) { warnAlert.style.display = 'none'; return; }
        try {
            const res = await fetch('/api/delegation/check-name?name=' + encodeURIComponent(name));
            if (!res.ok) return;
            const data = await res.json();
            warnAlert.style.display = data.exists ? 'block' : 'none';
        } catch(e) {}
    }

    document.getElementById('delegationForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        document.getElementById('schoolErrorAlert').style.display = 'none';

        const phoneEl = document.getElementById('leaderPhoneInput');
        if (!validatePhone(phoneEl)) { phoneEl.focus(); return; }

        const data = Object.fromEntries(new FormData(e.target).entries());
        data.leaderUserId = parseInt(data.leaderUserId);

        const submitBtn  = document.getElementById('submitBtn');
        const loadingMsg = document.getElementById('loadingMsg');
        submitBtn.disabled = true;
        loadingMsg.style.display = 'block';

        // 【#D-05 修复】发请求时携带 JWT token。
        // 后端已加鉴权，无 token → 401；同时后端会用 token 里的 userId
        // 强制覆盖 leaderUserId，前端传的值会被忽略，但仍保留以兼容旧逻辑。
        const token = sessionStorage.getItem('mun_jwt') || '';

        try {
            const response = await fetch('/api/delegation/create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...(token ? { 'Authorization': 'Bearer ' + token } : {})
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const result = await response.json();
                sessionStorage.setItem('mun_my_delegation_id', result.id);
                sessionStorage.setItem('mun_my_invite_code', result.inviteCode);
                alert("代表团创建成功！邀请码为：" + result.inviteCode);
                window.location.href = 'dashboard.html';
            } else {
                const errMsg = await response.text();
                submitBtn.disabled = false;
                loadingMsg.style.display = 'none';
                if (errMsg.includes('该学校已建好代表团')) {
                    document.getElementById('schoolErrorAlert').style.display = 'block';
                    document.getElementById('schoolInput').focus();
                } else {
                    alert("创建失败：" + errMsg);
                }
            }
        } catch (error) {
            submitBtn.disabled = false;
            loadingMsg.style.display = 'none';
            alert("网络错误，请检查连接后重试。");
        }
    });
</script>
<script src="aimunc-session.js"></script>
<script>document.addEventListener('DOMContentLoaded', function(){ initIdleTimeout(60, 'register.html'); });</script>
</body>
</html>
